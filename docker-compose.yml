services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - server-data:/app/data
      - server-uploads:/app/uploads
      - server-backups:/app/backups
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3001
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://erp.example.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - PUDUAPIKEY=${PUDUAPIKEY:-}
      - PUDUAPIsecret=${PUDUAPIsecret:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      server:
        condition: service_healthy
      dozzle:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.dozzle:/data
    environment:
      - DOZZLE_BASE=/dozzle
      - DOZZLE_AUTH_PROVIDER=${DOZZLE_AUTH_PROVIDER:-none}
      - DOZZLE_NO_ANALYTICS=true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Cloudflare Tunnel — exposes the app via erp.example.com
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run ozone360-erp-prod
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  server-data:
  server-uploads:
  server-backups:
